
# VNAM J&J - Administracion editorial
# Los archivos y las imagenes son publicos.

media:
  input: imagenes/trabajos
  output: /imagenes/trabajos
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:

  # FOTOGRAFIAS DE LA WEB
  - name: trabajos
    label: Fotografias de VNAM J&J
    type: file
    path: trabajos.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: titulo
        label: Nombre del trabajo
        type: string
        required: true

      - name: descripcion
        label: Descripcion del trabajo
        type: text
        required: true

      - name: categoria
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: confeccion
              label: Confeccion de prendas
            - name: bordados
              label: Bordados personalizados
            - name: estampados
              label: Estampados personalizados
            - name: matrices
              label: Diseno de matrices

      - name: imagen
        label: Fotografia
        type: image
        required: true

      - name: alt
        label: Descripcion de la imagen
        type: string
        required: true

      - name: publicado
        label: Mostrar en la pagina web
        type: boolean

  # TEXTOS INSTITUCIONALES
  - name: presentacion
    label: Presentacion de VNAM J&J
    type: file
    path: presentacion.json
    format: json
    operations:
      delete: false
    fields:
      - name: introduccion
        label: Introduccion de portada
        type: text
        required: true

      - name: nosotros1
        label: Nuestra historia - Parrafo 1
        type: text
        required: true

      - name: nosotros2
        label: Nuestra historia - Parrafo 2
        type: text
        required: true

      - name: mision
        label: Nuestra mision
        type: text
        required: true

      - name: vision
        label: Nuestra vision
        type: text
        required: true

  # SERVICIOS
  - name: servicios
    label: Servicios de VNAM J&J
    type: file
    path: servicios.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Identificador fijo
        type: select
        required: true
        options:
          values:
            - name: confeccion
              label: Confeccion
            - name: matrices
              label: Matrices
            - name: bordados
              label: Bordados
            - name: estampados
              label: Estampados

      - name: titulo
        label: Nombre del servicio
        type: string
        required: true

      - name: descripcion
        label: Descripcion del servicio
        type: text
        required: true

      - name: imagen
        label: Fotografia del servicio
        type: image

      - name: alt
        label: Descripcion accesible
        type: string
